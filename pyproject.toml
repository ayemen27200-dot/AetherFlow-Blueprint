[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherflow"
version = "0.1.0"
description = "AetherFlow Suite — distributed video-processing orchestrator scaffold"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "AetherFlow Contributors"}]
keywords = ["video", "whisper", "inpainting", "orchestrator", "fastapi"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
]
dependencies = [
  "httpx>=0.27.0,<1.0",
  "PyYAML>=6.0,<7.0",
  "cryptography>=42.0",
  "typer>=0.12.0,<1.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.30.0,<1.0",
  "pydantic>=2.7.0,<3.0",
  "pydantic-settings>=2.3.0,<3.0",
  "jinja2>=3.1.0,<4.0",
  "python-multipart>=0.0.9",
]
phone = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.30.0,<1.0",
  "pydantic>=2.7.0,<3.0",
  "pydantic-settings>=2.3.0,<3.0",
]
dev = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.30.0,<1.0",
  "pydantic>=2.7.0,<3.0",
  "pydantic-settings>=2.3.0,<3.0",
  "jinja2>=3.1.0,<4.0",
  "python-multipart>=0.0.9",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "respx>=0.21",
  "freezegun>=1.5",
  "yamllint>=1.35",
  "openapi-spec-validator>=0.7.2",
]
asr = ["faster-whisper>=1.0.0"]
cloud = ["modal>=0.63.0"]
telegram = ["python-telegram-bot>=21.0"]
gpu = [
  "torch>=2.3",
  "torchvision>=0.18",
  "easyocr>=1.7.1",
  "opencv-python-headless>=4.10",
  "faster-whisper>=1.0.0",
]

[project.scripts]
aetherflow = "agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "orchestrator*", "executors*", "web*", "scripts*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["orchestrator", "agent", "executors"]
omit = ["*/tests/*", "*/__init__.py"]
